# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: hosted-toolbox-agent
services:
    ai-project:
        host: azure.ai.project
    my-toolbox:
        host: azure.ai.toolbox
        uses:
            - ai-project
        tools:
            - type: mcp
              server_label: learn-mcp-conn
              server_url: https://learn.microsoft.com/api/mcp
              require_approval: never
            - type: web_search
              name: web_search
    hosted-toolbox-agent:
        project: src/hosted-toolbox-agent
        host: azure.ai.agent
        language: csharp
        codeConfiguration:
            runtime: dotnet_10
            entryPoint: HostedToolbox.dll
            dependencyResolution: remote_build
        uses:
            - ai-project
            - my-toolbox
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            TOOLBOX_NAME: ${TOOLBOX_NAME}
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: |
            A hosted agent that loads its tools from a single Foundry Toolbox via the AF Foundry hosting bridge. AddFoundryToolboxes(credential, name) connects to the Foundry Toolboxes MCP proxy at startup and exposes the toolbox's bundled tools to the agent on every request. The toolbox itself is provisioned out of band; see this sample's README for the portal walkthrough.
        kind: hosted
        metadata:
            tags:
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Agent Framework
                - Foundry Toolbox
                - MCP
        name: hosted-toolbox-agent
        protocols:
            - protocol: responses
              version: 2.0.0
        startupCommand: dotnet run
infra:
    provider: microsoft.foundry
